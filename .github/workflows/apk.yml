name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 准备 Capacitor 工程
        run: |
          mkdir -p app && cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www && cp -r ../v1/. www/
          npx cap init "合成大奶娃" com.local.bignaiwa --web-dir=www
          npx cap add android && npx cap sync android
      - name: 编译 APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: BigNaiWa-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
